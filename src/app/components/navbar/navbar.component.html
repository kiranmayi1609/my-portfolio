
<nav class="navbar">

  <!-- Logo -->
  <div class="logo" (click)="scrollTo('top')">
    Kiranmayi_portfolio
  </div>

  <!-- Mobile menu button -->
  <button
    class="menu-toggle"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen"
    aria-label="Toggle navigation menu"
  >
    <span>{{ menuOpen ? '✕' : '☰' }}</span>
  </button>

  <!-- Navigation links -->
  <div class="nav-links" [class.active]="menuOpen">

    <a
      *ngFor="let item of navItems"
      (click)="scrollTo(item.path)"
    >
      {{ item.label }}
    </a>

  </div>

</nav>
