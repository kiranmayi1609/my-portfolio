<section id="journey" class="journey-section">
  <div class="journey-container">

    <div class="section-header">
      <span class="section-label">MY STORY / 01</span>
      <h2>My <span>Journey</span></h2>
      <p>
        Every step has shaped my learning, personal growth,
        and journey into technology.
      </p>
    </div>

    <div class="roadmap">

      <div class="roadmap-line"></div>

      <article
        class="roadmap-item"
        *ngFor="let milestone of milestones; let i = index"
        [class.roadmap-item-up]="i % 2 === 0"
        [class.roadmap-item-down]="i % 2 !== 0"
      >

        <div class="roadmap-content">

          <div class="roadmap-card">

            <div class="card-top">
              <span class="milestone-number">
                0{{ i + 1 }}
              </span>

              <span class="milestone-period">
                {{ milestone.period }}
              </span>
            </div>

            <div class="milestone-icon">
              <i [class]="milestone.icon"></i>
            </div>

            <h3>{{ milestone.title }}</h3>

            <p>{{ milestone.description }}</p>

          </div>

        </div>

        <div class="roadmap-stop">
          <span>{{ i + 1 }}</span>
        </div>

      </article>

    </div>

    <div class="journey-footer">
      <span class="footer-line"></span>
      <p>Learning, growing and moving forward.</p>
      <span class="footer-line"></span>
    </div>

  </div>
</section>
